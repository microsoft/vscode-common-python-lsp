version: 2
updates:
  - package-ecosystem: 'npm'
    labels:
      - 'dependencies'
      - 'debt'
    directory: '/typescript'
    schedule:
      interval: 'weekly'
    groups:
      all-npm:
        patterns:
          - '*'
    open-pull-requests-limit: 10
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 14
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'

  - package-ecosystem: 'pip'
    labels:
      - 'dependencies'
      - 'debt'
    directory: '/python'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 14
    groups:
      all-pip:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      all-actions:
        patterns:
          - '*'
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 14
