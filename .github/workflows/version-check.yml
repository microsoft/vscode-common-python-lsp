name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  version-consistency:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: python -m scripts.version.validate
