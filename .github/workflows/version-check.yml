name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  version-consistency:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check version consistency
        run: python -m scripts.version.validate
