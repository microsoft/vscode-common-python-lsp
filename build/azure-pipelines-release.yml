# Azure Pipelines release pipeline for vscode-common-python-lsp.
#
# Triggered automatically when the VERSION file changes on main
# (i.e. a version bump is merged). Validates and tests both libraries, then
# creates a GitHub release and tags the commit.
#
# Uses MicroBuildTemplate for 1ES compliance (SDL, SBOM, etc).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - VERSION
pr: none

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

parameters:
  - name: pythonVersions
    type: object
    default:
      - "3.10"
      - "3.11"
      - "3.12"
      - "3.13"
      - "3.14"

variables:
  - name: TeamName
    value: vscode-common-python-lsp
  - name: NodeVersion
    value: "22.21.1"  # Keep in sync with .nvmrc
  - name: PythonVersion
    value: "3.10"
  - name: RepoName
    value: vscode-common-python-lsp


extends:
  template: azure-pipelines/MicroBuild.1ES.Official.Publish.yml@MicroBuildTemplate
  parameters:
    sdl:
      sourceAnalysisPool: VSEngSS-MicroBuild2022-1ES
      codeSignValidation:
        enabled: true
      sbom:
        enabled: true
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    customBuildTags:
      - ES365AIMigrationTooling

    stages:
      # Stage 1: Validate version consistency
      - stage: Validate
        displayName: Validate Release Version
        jobs:
          - job: VersionCheck
            displayName: Check version consistency
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/version-info
                  artifactName: version-info
            steps:
              - checkout: self

              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(PythonVersion)

              - script: python -m scripts.version.validate
                displayName: Validate version consistency

              - script: |
                  mkdir -p $(Build.ArtifactStagingDirectory)/version-info
                  cp VERSION $(Build.ArtifactStagingDirectory)/version-info/
                displayName: Stage VERSION file

      # Stage 2: Build & Test
      - stage: BuildAndTest
        displayName: Build & Test
        dependsOn: Validate
        condition: not(failed('Validate'))
        jobs:
          # TypeScript
          - job: TypeScript
            displayName: TypeScript build & test
            steps:
              - checkout: self

              - task: NodeTool@0
                inputs:
                  versionSpec: $(NodeVersion)

              - task: npm@1
                displayName: Install dependencies
                inputs:
                  command: ci
                  workingDir: typescript
                  customRegistry: useFeed
                  customFeed: '$(RepoName)'

              - task: npm@1
                displayName: Build
                inputs:
                  command: custom
                  customCommand: run build
                  workingDir: typescript

              - task: npm@1
                displayName: Lint
                inputs:
                  command: custom
                  customCommand: run lint
                  workingDir: typescript

              - task: npm@1
                displayName: Test
                inputs:
                  command: custom
                  customCommand: test
                  workingDir: typescript

          # Python tests — Linux
          - job: PythonTestLinux
            displayName: Python test (Linux)
            strategy:
              matrix:
                ${{ each ver in parameters.pythonVersions }}:
                  Python_${{ ver }}:
                    pythonVersion: ${{ ver }}
            steps:
              - checkout: self

              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(pythonVersion)

              - task: PipAuthenticate@1
                inputs:
                  artifactFeeds: '$(RepoName)'

              - script: python -m pip install --upgrade pip nox
                displayName: Install nox

              - script: nox -s tests

          # Python tests — Windows
          - job: PythonTestWindows
            displayName: Python test (Windows)
            pool:
              name: AzurePipelines-EO
              image: 1ESPT-Windows2022
              os: windows
            strategy:
              matrix:
                ${{ each ver in parameters.pythonVersions }}:
                  Python_${{ ver }}:
                    pythonVersion: ${{ ver }}
            steps:
              - checkout: self

              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(pythonVersion)

              - task: PipAuthenticate@1
                inputs:
                  artifactFeeds: '$(RepoName)'

              - script: python -m pip install --upgrade pip nox
                displayName: Install nox

              - script: nox -s tests

      # Stage 3: Create GitHub Release
      - stage: GitHubRelease
        displayName: Create GitHub Release
        dependsOn: BuildAndTest
        jobs:
          - job: CreateTag
            displayName: Create git tag
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: version-info
                  targetPath: $(Pipeline.Workspace)/version-info
            steps:
              - script: |
                  VERSION=$(cat $(Pipeline.Workspace)/version-info/VERSION)
                  echo "##vso[task.setvariable variable=ReleaseVersion]${VERSION}"
                displayName: Read version

              - task: GitHubRelease@1
                displayName: Create GitHub Release
                inputs:
                  gitHubConnection: "Github - VS Code Common Python LSP"
                  repositoryName: $(Build.Repository.Name)
                  action: create
                  target: $(Build.SourceVersion)
                  tagSource: userSpecifiedTag
                  tag: v$(ReleaseVersion)
                  title: v$(ReleaseVersion)
                  releaseNotesSource: inline
                  releaseNotesInline: |
                    ## What's Changed
                    Auto-generated release for v$(ReleaseVersion).
                    See [full changelog]($(Build.Repository.Uri)/compare/$(Build.SourceVersion)...v$(ReleaseVersion)) for details.
                  changeLogCompareToRelease: lastFullRelease
                  changeLogType: commitBased
